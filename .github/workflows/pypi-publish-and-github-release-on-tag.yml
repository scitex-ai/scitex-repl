name: release

# Tag-driven release on the selected self-hosted runner and verified CI SIF.
# All three Python test legs must pass before the wheel/sdist build, normal
# PyPI OIDC publication and automatic GitHub Release. Main promotion is a PR.
# CI_RUNS_ON selects the runner; SCITEX_CI_SIF/APPTAINER select image/runtime,
# and SCITEX_CI_SIF_SHA256 verifies the image before every inner script.
# workflow_dispatch may retry an existing immutable tag without replacing it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
  SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}
  SCITEX_CI_SIF_SHA256: ${{ vars.SCITEX_CI_SIF_SHA256 }}

jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      # The bare PR matrix keeps its existing names and GitHub-hosted route.
      # This tag job instead verifies the declared SIF digest and creates a
      # fresh job-owned environment for the tagged checkout's full extras.
      # Native RUN_E2E=1 tests are mandatory on both routes.
      - name: Run tests in the reused CI SIF (apptainer exec — deps layered, not on the bare runner)
        run: bash .github/ci/exec-in-sif.sh run-in-sif.sh ${{ matrix.python-version }}

  build:
    needs: test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      # Build INSIDE the SIF (no setup-python on the bare Spartan node).
      # Build in a fresh job-owned venv, check wheel/sdist identity and imports,
      # and run native E2E against the installed wheel before artifact upload.
      - name: Build wheel + sdist in the CI SIF (apptainer exec)
        env:
          SCITEX_REPL_RELEASE_TAG: ${{ steps.ver.outputs.version }}
        run: bash .github/ci/exec-in-sif.sh build-in-sif.sh 3.12
      # upload-artifact is a JS action — runs fine on the self-hosted runner.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-repl
    # id-token: write is what populates ACTIONS_ID_TOKEN_REQUEST_{TOKEN,URL},
    # which publish-in-sif.sh uses to mint the OIDC JWT. Keep it.
    permissions:
      contents: read
      id-token: write
    steps:
      # Need the repo checked out so .github/ci/exec-in-sif.sh +
      # publish-in-sif.sh are on disk (the build job uploaded only dist/).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Manual OIDC trusted publishing INSIDE the SIF — pypa/gh-action-pypi-
      # publish is a Docker action and the Spartan compute nodes have no Docker.
      # publish-in-sif.sh: GitHub OIDC JWT (audience=pypi) → PyPI mint-token →
      # twine upload dist/*. apptainer exec (no --cleanenv) passes the
      # ACTIONS_ID_TOKEN_REQUEST_* env vars into the SIF. fail-loud at each step.
      - name: Publish to PyPI via manual OIDC trusted publishing in the SIF
        env:
          SCITEX_REPL_RELEASE_TAG: ${{ needs.build.outputs.version }}
        run: bash .github/ci/exec-in-sif.sh publish-in-sif.sh 3.12

  release:
    needs: [build, publish]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
