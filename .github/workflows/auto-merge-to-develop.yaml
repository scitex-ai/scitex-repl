name: auto-merge-to-develop
# Merge green PRs that TARGET develop, the moment their checks complete.
# GitHub reads check_suite-triggered workflows from the DEFAULT branch (main),
# so this file lives on main but acts ONLY on PRs whose base is develop.
#
# Thin caller (PS-231). The body lives ONCE, org-side, in
# scitex-ai/.github@main. Checked before deleting the local copy rather
# than assuming: the org version is a strict superset — same merge loop
# (develop base, draft skip, codecov/readthedocs advisory) PLUS the
# `automerge-ok` label opt-in gate, the three-valued greenness fix
# (queued checks no longer count as green), and post-merge gate dispatch.
# A local copy does not track upstream fixes; it only looks like it does.

on:
  check_suite:
    types: [completed]
  workflow_dispatch: {}

jobs:
  auto-merge-to-develop:
    # Match the callee's merge and post-merge gate dispatch permissions.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: scitex-ai/.github/.github/workflows/auto-merge-to-develop.yml@main
    with:
      # JSON array STRING — consumed by fromJSON in the callee. A YAML list
      # decodes to something fromJSON rejects and the job queues forever.
      # Pinned explicitly (not inherited): a merge-path job holding
      # `contents: write` must not ride someone else's runner default.
      runs_on: '["ubuntu-latest"]'
    secrets: inherit
