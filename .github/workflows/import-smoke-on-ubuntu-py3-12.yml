name: import-smoke
# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Replaces the formerly-inlined import-smoke job with a thin `uses:` call
# into scitex-ai/.github reusable workflows — same job body, now centrally
# maintained. Triggers preserved verbatim from the prior local file.
#
# New required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
# may not match OLD required-status-check contexts on develop/main branch
# protection — branch protection updated as part of this PR where needed.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

jobs:
  import-smoke:
    # New required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit
