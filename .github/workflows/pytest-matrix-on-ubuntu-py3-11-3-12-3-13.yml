name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

jobs:
  test:
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Isolate runtime state in job scratch
        run: |
          set -euo pipefail
          job_root=$(mktemp -d "${RUNNER_TEMP:?runner scratch required}/repl-matrix.XXXXXXXX")
          mkdir -p "$job_root"/{tmp,cache/pip,cache/uv,config,data,scitex,ipython}
          {
            echo "TMPDIR=$job_root/tmp"
            echo "XDG_CACHE_HOME=$job_root/cache"
            echo "XDG_CONFIG_HOME=$job_root/config"
            echo "XDG_DATA_HOME=$job_root/data"
            echo "PIP_CACHE_DIR=$job_root/cache/pip"
            echo "UV_CACHE_DIR=$job_root/cache/uv"
            echo "COVERAGE_FILE=$job_root/.coverage"
            echo "PIP_CONFIG_FILE=/dev/null"
            echo "NETRC=/dev/null"
            echo "PIP_KEYRING_PROVIDER=disabled"
            echo "PYTHONDONTWRITEBYTECODE=1"
            echo "SCITEX_DIR=$job_root/scitex"
            echo "IPYTHONDIR=$job_root/ipython"
            echo "RUN_E2E=1"
          } >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -I -m pip --isolated install --index-url https://pypi.org/simple --upgrade pip
          # Full declared extras are mandatory; reduced installs cannot pass CI.
          python -I -m pip --isolated install --index-url https://pypi.org/simple -e ".[all,dev]"
      - name: Run tests
        run: |
          pytest tests/ --basetemp="$TMPDIR/pytest" -o "cache_dir=$XDG_CACHE_HOME/pytest" --cov=scitex_repl --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
