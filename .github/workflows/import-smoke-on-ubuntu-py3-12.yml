name: import-smoke

# Catches "wheel installs but `import scitex_repl` blows up at
# runtime" — separate from the full pytest suite so a broken
# entry-point fails fast without paying for the matrix.
#
# Thin caller (PS-231). The body lives ONCE, org-side, in
# scitex-ai/.github@main, and does exactly what the local copy did:
# bare `pip install -e .` (no extras) + import — the shape that catches
# `[project] dependencies` drift the `[all,dev]` matrix masks — plus
# fork-guard hardening the leaf never had.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

jobs:
  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    with:
      # JSON array STRING — consumed by fromJSON in the callee. Matches the
      # leaf's previous `runs-on: ubuntu-latest`.
      runs_on: '["ubuntu-latest"]'
    secrets: inherit
